# Publication d'une version : pousser un tag vX.Y.Z égal à la version de
# manifest.json, après avoir daté sa section dans CHANGELOG.md. HACS installe
# ensuite la version depuis la release (zip de custom_components/atmo_qualite_air).
name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Tag vX.Y.Z déjà validé et livré dans main
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publication
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Vérifier que le tag est livré dans main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" FETCH_HEAD

      # python3 du runner maison trop ancien (str.removeprefix : Python ≥ 3.9).
      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Tag = version du manifest, notes tirées du CHANGELOG
        run: uv run --group scripts python scripts/notes_de_version.py "${TAG}" > notes.md

      - name: Archive de l'intégration
        run: cd custom_components/atmo_qualite_air && uv run --no-project python -m zipfile -c ../../atmo_qualite_air.zip .

      - name: Release GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          body_path: notes.md
          files: atmo_qualite_air.zip
          fail_on_unmatched_files: true
